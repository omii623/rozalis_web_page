@if (images.length > 0) {
  <ul class="gallery" aria-label="Galéria">
    @for (image of images; track image; let i = $index) {
      <li>
        <button type="button" class="gallery-item" (click)="open(i)" [attr.aria-label]="'Kép megnyitása: ' + (i + 1) + '. ROZALIS ékszer'">
          <img [src]="image" [alt]="'ROZALIS ékszer – ' + (i + 1) + '. kép'" loading="lazy" decoding="async" />
        </button>
      </li>
    }
  </ul>
} @else {
  <p class="empty-message">Még nincsenek képek.</p>
}

@let current = selectedIndex();
@if (current !== null) {
  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Nagyított kép" (click)="close()">
    <img [src]="images[current]" [alt]="'ROZALIS ékszer – ' + (current + 1) + '. kép'" (click)="$event.stopPropagation()" />

    <button type="button" class="lb-btn close-btn" aria-label="Bezárás" (click)="close()">✕</button>
    @if (images.length > 1) {
      <button type="button" class="lb-btn nav-btn prev" aria-label="Előző kép" (click)="step(-1); $event.stopPropagation()">‹</button>
      <button type="button" class="lb-btn nav-btn next" aria-label="Következő kép" (click)="step(1); $event.stopPropagation()">›</button>
    }
  </div>
}
