@if (images.length > 0) {
  <div class="gallery">
    @for (image of images; track image) {
      <div class="gallery-item" (click)="openImage(image)">
        <img [src]="image" [alt]="'Fotó ' + ($index + 1)" loading="lazy" />
      </div>
    }
  </div>
} @else {
  <p class="empty-message">Még nincsenek képek.</p>
}

@if (selectedImage) {
  <div class="lightbox" (click)="closeImage()">
    <img [src]="selectedImage" alt="Nagyított kép" />
    <button class="close-btn" (click)="closeImage()">✕</button>
  </div>
}
