name: Build site & sync Google Drive gallery

# Az auto-sync/photos branch CSAK a kész, buildelt oldalt tartalmazza (a dist tartalmát a gyökérben).
#
#  • push a masterre            → teljes build + friss képek a Drive-ról
#  • napi időzítés / kézi indítás → csak a képek (images/photo-*.webp + images/gallery.json) cserélődnek,
#                                   és csak akkor, ha a Drive mappa változott
# A branch mindig egyetlen commitból áll (force push), így nem nő a mérete.
on:
  push:
    branches: [master]

  # Napi ellenőrzés 6:00-kor (UTC)
  schedule:
    - cron: '0 6 * * *'

  # Manuális indítás a GitHub Actions fülön
  workflow_dispatch:
    inputs:
      force:
        description: 'Képek frissítése akkor is, ha a Drive mappa nem változott'
        type: boolean
        default: false
      rebuild:
        description: 'Teljes újrabuildelés (kód + képek)'
        type: boolean
        default: false

# Egyszerre csak egy futás írhatja a branchet (a futó nem szakad meg)
concurrency:
  group: site-branch
  cancel-in-progress: false

permissions:
  contents: write

env:
  BRANCH: auto-sync/photos
  BUILD_DIR: dist/link-tree/browser
  SITE_DIR: site
  DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}  # opcionális felülírás

jobs:
  site:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Open site branch
        id: site
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # depth=2: így látszik, hogy a branch már egyetlen commit-e
          if git fetch --depth=2 origin "$BRANCH" 2>/dev/null; then
            git worktree add -B "$BRANCH" "$SITE_DIR" FETCH_HEAD
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$(git rev-list --count FETCH_HEAD)" = "1" ]; then
              echo "single=true" >> "$GITHUB_OUTPUT"
            else
              echo "ℹ️ A $BRANCH branch több commitból áll — össze lesz vonva."
              echo "single=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ℹ️ Még nincs $BRANCH branch — teljes build következik."
            git worktree add --orphan -b "$BRANCH" "$SITE_DIR"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide what to do
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.rebuild }}" = "true" ] \
             || [ "${{ steps.site.outputs.exists }}" != "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"; echo "🏗️ Teljes build."
          elif [ "${{ inputs.force }}" = "true" ]; then
            echo "mode=photos" >> "$GITHUB_OUTPUT"; echo "📸 Kényszerített képfrissítés."
          else
            # Gyors ellenőrzés (pár másodperc, függőségek nélkül)
            node scripts/sync-photos.js --check --out "$SITE_DIR/images" | tee /tmp/check.log
            if grep -q 'changed=true' /tmp/check.log; then
              echo "mode=photos" >> "$GITHUB_OUTPUT"
            else
              echo "mode=none" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install dependencies
        if: steps.mode.outputs.mode != 'none'
        run: npm ci

      - name: Build site
        if: steps.mode.outputs.mode == 'full'
        env:
          # GitHub Pages projekt-oldal: https://<user>.github.io/<repo>/ → base href = /<repo>/
          # Saját domainnél állítsd a BASE_HREF repó változót "/"-re.
          BASE_HREF: ${{ vars.BASE_HREF || format('/{0}/', github.event.repository.name) }}
        run: |
          echo "🔗 base href: $BASE_HREF"
          npx ng build --base-href "$BASE_HREF"
          # SPA: ismeretlen útvonalon (pl. /link-tree) is az Angular app töltődjön be
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"
          touch "$BUILD_DIR/.nojekyll"
          # A branch tartalmát a friss buildre cseréljük (.git marad)
          find "$SITE_DIR" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$BUILD_DIR"/. "$SITE_DIR"/

      - name: Sync photos from Google Drive into site
        if: steps.mode.outputs.mode != 'none'
        run: node scripts/sync-photos.js --out "$SITE_DIR/images"

      # A branch mindig EGYETLEN, előzmények nélküli commit: a régi (hash-elt nevű) képek és
      # build fájlok így a historyban sem halmozódnak fel. Force push cseréli le.
      - name: Publish site branch (single commit)
        if: steps.mode.outputs.mode != 'none'
        working-directory: ${{ env.SITE_DIR }}
        run: |
          git add -A
          if [ "${{ steps.site.outputs.single }}" = "true" ] && git diff --cached --quiet; then
            echo "✅ Nincs változás a branchen."
            exit 0
          fi
          git diff --cached --stat || true
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            MSG="🏗️ Build: ${GITHUB_SHA::7} + Drive képek"
          else
            MSG="📸 Drive képek frissítve"
          fi
          COMMIT=$(git commit-tree "$(git write-tree)" -m "$MSG ($(date -u +'%Y-%m-%d %H:%M UTC'))")
          git push -f origin "$COMMIT:refs/heads/$BRANCH"
          echo "✅ $BRANCH = $(git rev-parse --short "$COMMIT") (1 commit, előzmények nélkül)"
